[project]
name = "dotagents-dev"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false
prerelease = "disallow"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.6",
  "ty>=0.0.79",
]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests", "skills"]
addopts = ["--import-mode=importlib", "-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"
