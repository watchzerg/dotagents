[project]
name = "{{DIST_NAME}}"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false
prerelease = "disallow"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "ruff>=0.16",
  "ty>=0.0.79",
]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = ["--import-mode=importlib", "-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"
