# 项目命令契约：check-toolchain、install、fmt、lint、typecheck、test、test-full、docs-check、docs-affected、gate-core、gate-full 是必需的公开 task，名称与职责保持稳定。
# 本项目没有预置 stack：下列 task 保持非零退出并说明原因，不能用空命令冒充通过。
# 接入时保留 task 名与职责，按 stack 把实现写成 mise-tasks/<stack>/ 下的 file task，再由这里的公开 task 聚合；
# full 测试经 scripts/with_lock.py 的主机锁串行。定义见 docs/development/workflow.md。

[tools]

[env]
# 项目环境变量写在这里；本机私有值写 mise.local.toml（不提交）。

[tasks.check-toolchain]
description = "核对本项目实际使用的运行时与版本声明"
run = "echo '错误：check-toolchain 尚未接入本项目工具链；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.install]
description = "按 lock 安装依赖"
run = "echo '错误：install 尚未接入本项目工具链；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.fmt]
description = "格式化并修复可自动修复的 lint；会修改文件，不属于门禁"
run = "echo '错误：fmt 尚未接入本项目工具链；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.lint]
description = "静态检查，不修改源码"
run = "echo '错误：lint 尚未接入本项目工具链；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.typecheck]
description = "类型检查，不修改源码"
run = "echo '错误：typecheck 尚未接入本项目工具链；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.test]
description = "运行全部 core 测试"
run = "echo '错误：test 尚未接入本项目测试 runner；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.test-full]
description = "在主机锁内运行 full 测试"
run = "echo '错误：test-full 尚未接入本项目测试 runner；见 docs/development/workflow.md。' >&2; exit 1"

[tasks.docs-check]
description = "检查文档链接、锚点、可达性、索引登记、体量预算、标题骨架与 covers，不联网"
run = "python3 scripts/check_docs.py"

[tasks.docs-affected]
description = "改动提示：列出相对基准（默认 HEAD，可传参）的改动命中 covers 的文档页；总是成功，不属于门禁"
run = "python3 scripts/check_docs.py --affected"

[tasks.gate-core]
description = "可跨 worktree 并行：工具链、文档、静态检查与全部 core 测试，彼此并行"
depends = ["check-toolchain", "docs-check", "lint", "typecheck", "test"]

[tasks.gate-full]
description = "完整门禁：gate-core 通过后在主机锁内运行 full 测试"
depends = ["gate-core"]
run = "echo '错误：full 测试入口尚未接入；见 docs/development/workflow.md。' >&2; exit 1"
